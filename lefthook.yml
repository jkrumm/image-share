# The shipped basalt preset is extended, not copied — it auto-updates with the package.
# Path is `apps/admin/node_modules/...`: under bun's isolated linker basalt-ui installs
# beside the package that depends on it, and a root-relative `extends` resolves to
# nothing there (lefthook merges a missing file silently).
#
# The preset's `check-theme` runs from the repo ROOT, and since basalt-ui 1.29.0 the CLI
# no longer ascends or relocates on its own — one resolver, `BASALT_CWD` then cwd — so at
# the root it reads a directory with no basalt config. `BASALT_CWD` below names the one
# package that carries one, and it is still required: 1.30.0 fixed the preset's BIN
# default, not the resolver. That default is now `<BASALT_CWD>/node_modules/.bin/basalt-ui`
# — exactly the path this file used to pin — so the `BASALT_BIN` half of the patch is gone.
# `root: 'apps/admin/'` is the other sanctioned fix; `BASALT_CWD` is kept because oxlint
# and oxfmt do want to run at the root, where this repo's oxlint config and binaries are.
#
# NOTE on overriding the preset: lefthook lets `extends` WIN on a colliding key, so a
# local `run:`/`glob:` under a preset command name is silently discarded. Only NEW keys
# merge (`env:`, `exclude:`, `skip:`). 1.21.0 narrowed the preset's `oxfmt` glob to
# source extensions, so the markdown carve-out this file used to need is gone.
extends:
  - apps/admin/node_modules/basalt-ui/configs/lefthook.yml

pre-commit:
  commands:
    # Whole-tree checks the preset's staged-file commands do not cover: apps/api is
    # outside basalt's roots, and `sync --check` catches drift in the managed docs.
    check:
      run: bun run format:check && bun run lint && bun run --cwd apps/admin basalt-ui sync --check
    # `env:` is a NEW key under a preset command name, so it merges instead of being
    # discarded the way a colliding `run:` would be.
    check-theme:
      env:
        BASALT_CWD: apps/admin
